<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Custom Squad | Администрирование | Черная обводка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* ГРАДИЕНТНЫЙ ФОН (желтый -> оранжевый сверху вниз) */
        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f5e050 0%, #e67e22 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }
        
        .neon-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }
        .neon-drop {
            position: absolute;
            background: radial-gradient(circle, rgba(80, 255, 180, 0.7), rgba(0, 255, 200, 0.25));
            border-radius: 50%;
            box-shadow: 0 0 5px #00e6b8, 0 0 8px #00ccaa;
            opacity: 0.45;
            animation: fallNeon linear infinite;
            pointer-events: none;
        }
        @keyframes fallNeon {
            0% { transform: translateY(-10vh) scale(1); opacity: 0.5; }
            100% { transform: translateY(110vh) scale(0.6); opacity: 0; }
        }
        .admin-corner {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 16px 8px 20px;
            border: 2px solid #000000;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            color: #ffffff;
            font-weight: 500;
        }
        .admin-btn {
            background: transparent;
            border: 2px solid #000000;
            color: #000000;
            padding: 5px 14px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,255,255,0.2);
        }
        .admin-btn:hover { background: rgba(0, 0, 0, 0.2); box-shadow: 0 0 5px rgba(0,0,0,0.3); }
        .admin-status { font-size: 0.7rem; background: #00000022; padding: 4px 10px; border-radius: 40px; color: #000; font-weight: 600; }
        .fullscreen-hero {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 12, 18, 0.96);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: transform 0.7s cubic-bezier(0.34, 1.1, 0.55, 1), opacity 0.5s ease;
            transform: scale(1);
            opacity: 1;
            backdrop-filter: blur(10px);
        }
        .fullscreen-hero.hide-hero { transform: scale(0.85); opacity: 0; pointer-events: none; }
        .hero-title {
            font-size: clamp(3rem, 15vw, 7rem);
            font-weight: 700;
            background: linear-gradient(135deg, #000000, #333333);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gentlePulse 1.2s ease-out;
        }
        @keyframes gentlePulse { 0% { opacity: 0; transform: scale(0.96); } 100% { opacity: 1; transform: scale(1); } }
        
        /* Основной контент: белый с прозрачностью 15% */
        .main-content {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            pointer-events: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2rem 2rem 1.5rem 2rem;
            border: 3px solid #000000;
            position: relative;
            z-index: 15;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .main-content.visible { opacity: 1; pointer-events: auto; }
        .center-stage { text-align: center; margin-bottom: 2rem; }
        .site-title {
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 700;
            color: #000000;
            margin-bottom: 2rem;
            text-shadow: none;
        }
        .button-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.8rem; margin-bottom: 2rem; }
        .minimal-btn {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border: 2px solid #000000;
            border-radius: 60px;
            padding: 0.8rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
            transition: 0.25s;
        }
        .minimal-btn:hover { background: rgba(255, 255, 255, 0.5); transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,0.2); }
        .settings-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #000000;
            color: #000000;
        }
        .settings-btn:hover { background: rgba(255, 255, 255, 0.5); }
        .citizens-panel, .events-panel, .settings-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            border: 2px solid #000000;
            padding: 1.6rem;
        }
        .events-panel {
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .events-locked-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }
        .events-locked-text {
            color: #000;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }
        .unlock-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #000000;
            border-radius: 60px;
            padding: 0.6rem 1.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 1rem;
        }
        .unlock-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        .panel-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .search-box input {
            padding: 0.7rem 1rem;
            border-radius: 60px;
            border: 2px solid #000000;
            background: rgba(255, 255, 255, 0.7);
            color: #000000;
            width: 260px;
        }
        .search-box input:focus { outline: none; border-color: #000000; box-shadow: 0 0 0 2px rgba(0,0,0,0.2); background: rgba(255,255,255,0.9); }
        .sort-buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .sort-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #000000;
            border-radius: 40px;
            padding: 0.45rem 1rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: #000000;
            transition: 0.2s;
            font-weight: 500;
        }
        .sort-btn.active { border-color: #000000; background: rgba(0, 0, 0, 0.15); color: #000000; }
        .add-btn, .settings-add-btn {
            background: #000000;
            border: none;
            color: white;
            padding: 0.5rem 1.3rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .add-btn:hover, .settings-add-btn:hover { background: #333333; transform: scale(1.02); }
        .edit-btn, .delete-btn, .settings-edit-btn, .settings-delete-btn {
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
            margin: 0 3px;
        }
        .edit-btn, .settings-edit-btn { border: 2px solid #fbbf24; color: #000000; }
        .edit-btn:hover, .settings-edit-btn:hover { background: rgba(251, 191, 36, 0.4); }
        .delete-btn, .settings-delete-btn { border: 2px solid #e53e3e; color: #000000; }
        .delete-btn:hover, .settings-delete-btn:hover { background: rgba(229, 62, 62, 0.2); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.2); color: #000000; }
        th { color: #000000; background: rgba(0, 0, 0, 0.05); font-weight: 700; }
        .activity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid #00000022;
        }
        .activity-const { background: #0f5c4b33; color: #0f5c4b; }
        .activity-active { background: #2b6e5a33; color: #2b6e5a; }
        .activity-low { background: #7c5e2a33; color: #7c5e2a; }
        .activity-inactive { background: #632c3c33; color: #632c3c; }
        .status-badge, .duty-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid #00000022;
        }
        .status-default { background: #2c4f5c33; color: #2c4f5c; }
        .status-reserve { background: #7c5e2a33; color: #7c5e2a; }
        .status-citizen { background: #2c4f5c33; color: #2c4f5c; }
        .status-newbie { background: #314c5e33; color: #314c5e; }
        .status-honor { background: #6e3e4233; color: #6e3e42; }
        .status-active { background: #0f5c4b33; color: #0f5c4b; }
        .name-with-nick { display: flex; flex-direction: column; }
        .main-name { font-weight: 700; color: #000; }
        .sub-nick { font-size: 0.7rem; color: #333; margin-top: 2px; }
        .pagination-container { display: flex; justify-content: center; gap: 1rem; margin-top: 1.8rem; }
        .page-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #000000;
            border-radius: 60px;
            padding: 0.4rem 1.2rem;
            cursor: pointer;
            color: #000000;
            transition: 0.2s;
            font-weight: 500;
        }
        .page-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.5); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .back-button { margin-top: 1.5rem; background: rgba(255, 255, 255, 0.3); border: 2px solid #000000; border-radius: 60px; padding: 0.45rem 1.8rem; cursor: pointer; color: #000000; transition: 0.2s; font-weight: 500; }
        .back-button:hover { background: rgba(255, 255, 255, 0.5); }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            border: 3px solid #000000;
            color: #000000;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        .modal-content h3 { margin-bottom: 1rem; color: #000000; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 0.7rem;
            margin: 0.5rem 0 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #000000;
            border-radius: 20px;
            color: #000000;
            font-size: 0.9rem;
        }
        .modal-buttons { display: flex; gap: 1rem; margin-top: 1.2rem; }
        .modal-buttons button { flex: 1; padding: 0.7rem; border-radius: 40px; cursor: pointer; font-weight: bold; border: none; }
        
        .custom-dialog {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            z-index: 10002;
            align-items: center;
            justify-content: center;
        }
        .dialog-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            padding: 2rem;
            width: 90%;
            max-width: 380px;
            border: 3px solid #000000;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
        }
        .dialog-card h3 { color: #000000; margin-bottom: 1rem; font-size: 1.3rem; }
        .dialog-card p { color: #333; margin-bottom: 1.8rem; line-height: 1.4; }
        .dialog-buttons { display: flex; gap: 1rem; }
        .dialog-buttons button { flex: 1; padding: 0.7rem; border-radius: 60px; font-weight: 600; cursor: pointer; border: 2px solid #000000; transition: 0.2s; }
        .dialog-confirm { background: #000000; color: white; }
        .dialog-confirm:hover { background: #333333; transform: scale(1.02); }
        .dialog-cancel { background: transparent; border: 2px solid #000000; color: #000000; }
        .dialog-cancel:hover { background: rgba(0,0,0,0.1); }
        
        .custom-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #000000;
            border-left: 4px solid #000000;
            padding: 12px 24px;
            border-radius: 60px;
            color: #ffffff;
            font-size: 0.9rem;
            z-index: 10003;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .admin-auth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 10001;
            align-items: center;
            justify-content: center;
        }
        .admin-auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            border: 3px solid #000000;
            text-align: center;
        }
        .admin-auth-card h2 { color: #000000; margin-bottom: 0.5rem; }
        .admin-auth-card input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.7rem 0;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #000000;
            border-radius: 60px;
            color: #000000;
        }
        .admin-auth-card button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: #000000;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            color: white;
        }
        .admin-auth-card .close-auth { background: transparent; border: 2px solid #000000; color: #000000; margin-top: 0.5rem; }
        .settings-section { margin-bottom: 2rem; border-bottom: 1px solid rgba(0,0,0,0.2); padding-bottom: 1rem; }
        .settings-section h3 { color: #000000; margin-bottom: 1rem; font-size: 1.2rem; }
        .settings-table { width: 100%; margin-top: 0.5rem; }
        .settings-table td { padding: 8px 6px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        @media (max-width: 900px) { .panel-header { flex-direction: column; align-items: stretch; } .sort-buttons { justify-content: center; } }
    </style>
</head>
<body>

<div class="neon-rain" id="neonRainContainer"></div>
<div class="admin-corner">
    <span>🔐 Админ-доступ</span>
    <button class="admin-btn" id="adminRegisterBtn">Войти</button>
    <span class="admin-status" id="adminStatusText">Не авторизован</span>
</div>
<div class="fullscreen-hero" id="heroScreen"><div class="hero-title">Custom Squad</div></div>
<div class="main-content" id="mainContent">
    <div class="center-stage">
        <h1 class="site-title">Custom Squad</h1>
        <div class="button-group" id="buttonGroup">
            <button class="minimal-btn" id="showCitizensBtn">Таблица граждан</button>
            <button class="minimal-btn" id="showEventsBtn">События сквада</button>
        </div>
    </div>
    <div id="dynamicPanel"></div>
</div>

<!-- Кастомные диалоги -->
<div id="customConfirmDialog" class="custom-dialog">
    <div class="dialog-card">
        <h3 id="dialogTitle">Подтверждение</h3>
        <p id="dialogMessage">Вы уверены?</p>
        <div class="dialog-buttons">
            <button id="dialogConfirmBtn" class="dialog-confirm">Да</button>
            <button id="dialogCancelBtn" class="dialog-cancel">Нет</button>
        </div>
    </div>
</div>

<div id="customAlertDialog" class="custom-dialog">
    <div class="dialog-card" style="border-color:#000000;">
        <h3 style="color:#000000;">Уведомление</h3>
        <p id="alertMessage">Сообщение</p>
        <div class="dialog-buttons">
            <button id="alertOkBtn" class="dialog-confirm" style="background:#000000; color:white;">OK</button>
        </div>
    </div>
</div>

<div id="toastMessage" class="custom-toast"></div>

<!-- Модалки добавления/редактирования -->
<div id="addCitizenModal" class="modal"><div class="modal-content"><h3>➕ Добавление гражданина</h3>
    <input type="text" id="modalFullName" placeholder="Имя и фамилия"><input type="text" id="modalMinecraft" placeholder="Minecraft ник">
    <input type="text" id="modalDiscord" placeholder="Discord ник"><input type="date" id="modalJoinDate">
    <select id="modalStatus"></select><select id="modalPower"></select>
    <select id="modalActivity"><option value="Постоянный актив">Постоянный актив</option><option value="Активный">Активный</option><option value="Малоактивный">Малоактивный</option><option value="Неактивный">Неактивный</option></select>
    <select id="modalDuty"></select>
    <div class="modal-buttons"><button id="modalConfirmBtn" style="background:#000000; color:white;">Добавить</button><button id="modalCancelBtn" style="background:#ccc;">Отмена</button></div>
</div></div>

<div id="editCitizenModal" class="modal"><div class="modal-content"><h3>✏️ Редактирование</h3>
    <input type="hidden" id="editId"><input type="text" id="editFullName" placeholder="Имя"><input type="text" id="editMinecraft" placeholder="Minecraft">
    <input type="text" id="editDiscord" placeholder="Discord"><input type="date" id="editJoinDate">
    <select id="editStatus"></select><select id="editPower"></select>
    <select id="editActivity"><option value="Постоянный актив">Постоянный актив</option><option value="Активный">Активный</option><option value="Малоактивный">Малоактивный</option><option value="Неактивный">Неактивный</option></select>
    <select id="editDuty"></select>
    <div class="modal-buttons"><button id="editConfirmBtn" style="background:#fbbf24;">Сохранить</button><button id="editCancelBtn" style="background:#ccc;">Отмена</button></div>
</div></div>

<div id="editDictModal" class="modal"><div class="modal-content"><h3 id="dictModalTitle">Добавление</h3>
    <input type="hidden" id="dictType"><input type="hidden" id="dictOldValue"><input type="text" id="dictNewValue" placeholder="Новое значение">
    <div class="modal-buttons"><button id="dictSaveBtn" style="background:#fbbf24;">Сохранить</button><button id="dictCancelBtn" style="background:#ccc;">Отмена</button></div>
</div></div>

<div id="adminAuthModal" class="admin-auth-modal"><div class="admin-auth-card"><h2>🔐 Вход администратора</h2>
    <input type="text" id="adminLogin" placeholder="Логин"><input type="password" id="adminPassword" placeholder="Пароль">
    <button id="submitAdminAuth">Войти</button><button id="closeAdminAuth" class="close-auth">Отмена</button>
</div></div>

<script>
    // ========== КАСТОМНЫЕ ДИАЛОГИ ==========
    let pendingConfirmCallback = null;
    function showConfirm(title, message, onConfirm) {
        const dialog = document.getElementById('customConfirmDialog');
        document.getElementById('dialogTitle').innerText = title;
        document.getElementById('dialogMessage').innerHTML = message;
        pendingConfirmCallback = onConfirm;
        dialog.style.display = 'flex';
    }
    function closeConfirm() { document.getElementById('customConfirmDialog').style.display = 'none'; pendingConfirmCallback = null; }
    function showAlert(message) { document.getElementById('alertMessage').innerHTML = message; document.getElementById('customAlertDialog').style.display = 'flex'; }
    function closeAlert() { document.getElementById('customAlertDialog').style.display = 'none'; }
    function showToast(message, isError = false) {
        const toast = document.getElementById('toastMessage');
        toast.innerText = message;
        toast.style.borderLeftColor = isError ? '#e53e3e' : '#000000';
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(20px)'; }, 2500);
    }
    document.getElementById('dialogConfirmBtn').onclick = () => { if(pendingConfirmCallback) pendingConfirmCallback(true); closeConfirm(); };
    document.getElementById('dialogCancelBtn').onclick = () => { if(pendingConfirmCallback) pendingConfirmCallback(false); closeConfirm(); };
    document.getElementById('alertOkBtn').onclick = closeAlert;
    
    // Неоновый дождь
    (function initRain() {
        const rc = document.getElementById('neonRainContainer');
        for(let i=0;i<100;i++){ let d=document.createElement('div'); d.classList.add('neon-drop'); let s=Math.random()*4+1.2;
        d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*5+2.5}s;animation-delay:${Math.random()*10}s`;
        rc.appendChild(d); }
    })();

    // Шифрование для админа
    const ENC_KEY = 0x5A;
    function encrypt(s){ let r=''; for(let i=0;i<s.length;i++) r+=String.fromCharCode(s.charCodeAt(i)^ENC_KEY); return r; }
    function decrypt(e){ let r=''; for(let i=0;i<e.length;i++) r+=String.fromCharCode(e.charCodeAt(i)^ENC_KEY); return r; }
    const ENC_LOGIN = encrypt("Adminchik");
    const ENC_PASS = encrypt("qweqwe123123");
    function isMasterAdmin(login,pwd){ return login===decrypt(ENC_LOGIN) && pwd===decrypt(ENC_PASS); }

    // Словари
    let statuses = ["В резерве", "Гражданин", "Новичок", "Почётный", "Грин-карта"];
    let works = ["Советник", "Капитан", "Мастер", "Лейтенант", "Страж", "Рядовой", "Кандидат"];
    let duties = ["военнообязанный", "Отстранен"];
    
    let eventsLocked = localStorage.getItem('sqd_events_locked') !== 'false';
    function saveEventsLocked() { localStorage.setItem('sqd_events_locked', eventsLocked); }
    function saveDictionaries() {
        localStorage.setItem('sqd_statuses', JSON.stringify(statuses));

    let currentSort="name_asc", currentSearchQuery="", currentPage=1;
    const ITEMS_PER_PAGE=10;
    window.currentPanel=null;

    function getActivityClass(act){
        if(act==="Постоянный актив") return "activity-const";
        if(act==="Активный") return "activity-active";
        if(act==="Малоактивный") return "activity-low";
        return "activity-inactive";
    }
    function formatDate(d){ return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}); }
    function sortCitizens(arr,type){
        let copy=[...arr];
        if(type==='name_asc') copy.sort((a,b)=>a.fullName.localeCompare(b.fullName,'ru'));
        if(type==='activity_desc'){ const order={"Постоянный актив":1,"Активный":2,"Малоактивный":3,"Неактивный":4}; copy.sort((a,b)=>(order[a.activity]||5)-(order[b.activity]||5)); }
        if(type==='joinDate_asc') copy.sort((a,b)=>new Date(a.joinDate)-new Date(b.joinDate));
        if(type==='powerStatus_asc'){ const ord={}; works.forEach((w,idx)=>ord[w]=idx); copy.sort((a,b)=>(ord[a.powerStatus]||999)-(ord[b.powerStatus]||999)); }
        if(type==='duty_asc'){ const ord={}; duties.forEach((d,idx)=>ord[d]=idx); copy.sort((a,b)=>(ord[a.militaryDuty]||999)-(ord[b.militaryDuty]||999)); }
        return copy;
    }
    function filterCitizens(arr,q){ if(!q.trim()) return arr; let low=q.toLowerCase(); return arr.filter(c=>c.fullName.toLowerCase().includes(low)||c.minecraft.toLowerCase().includes(low)||c.discord.toLowerCase().includes(low)); }
    function refreshTableBodyOnly(){
        if(window.currentPanel!=='citizens') return;
        let filtered=filterCitizens(citizensData,currentSearchQuery);
        let sorted=sortCitizens(filtered,currentSort);
        let totalPages=Math.ceil(sorted.length/ITEMS_PER_PAGE);
        if(currentPage>totalPages) currentPage=Math.max(1,totalPages);
        let start=(currentPage-1)*ITEMS_PER_PAGE;
        let paged=sorted.slice(start,start+ITEMS_PER_PAGE);
        let tbody=document.querySelector('#citizensDynamicTable tbody');
        if(!tbody) return;
        tbody.innerHTML='';
        if(paged.length===0){ tbody.innerHTML=`<tr><td colspan="${isAdmin?8:7}" class="no-results">🚫 Граждане не найдены</td>`; }
        else{
            paged.forEach(c=>{
                let statusClass = getStatusClass(c.status);
                let row=tbody.insertRow();
                row.insertCell(0).innerHTML=`<div class="name-with-nick"><span class="main-name">${escapeHtml(c.fullName)}${isAdmin?' <span style="color:#000;font-size:0.7rem;">👑</span>':''}</span><span class="sub-nick">🎮 ${escapeHtml(c.minecraft)} • 💬 ${escapeHtml(c.discord)}</span></div>`;
                row.insertCell(1).innerHTML=formatDate(c.joinDate);
                row.insertCell(2).innerHTML=`<div class="activity-badge ${getActivityClass(c.activity)}">${escapeHtml(c.activity)}</div>`;
                row.insertCell(3).innerHTML=escapeHtml(c.powerStatus);
                row.insertCell(4).innerHTML=`<span class="status-badge ${statusClass}">${escapeHtml(c.status)}</span>`;
                row.insertCell(5).innerHTML=`<span class="duty-badge" style="${c.militaryDuty==='Отстранен'?'background:#5c3a3a33;':'background:#1e4d6b33;'} padding:0.2rem 0.7rem; border-radius:40px;">${escapeHtml(c.militaryDuty)}</span>`;
                if(isAdmin){
                    let actions=document.createElement('div');
                    let editBtn=document.createElement('button'); editBtn.innerText='✏️ Изменить'; editBtn.className='edit-btn';
                    let delBtn=document.createElement('button'); delBtn.innerText='🗑️ Удалить'; delBtn.className='delete-btn';
                    editBtn.onclick=()=>openEditModal(c);
                    delBtn.onclick=()=>{ showConfirm("Удаление", `Удалить гражданина "${c.fullName}"?`, (ok) => { if(ok){ citizensData=citizensData.filter(cit=>cit.id!==c.id); refreshTableBodyOnly(); showToast(`Гражданин ${c.fullName} удален`); } }); };
                    actions.appendChild(editBtn); actions.appendChild(delBtn);
                    row.insertCell(6).appendChild(actions);
                }
            });
        }
        let pagDiv=document.querySelector('#paginationControls');
        if(pagDiv && totalPages>1){
            pagDiv.innerHTML=`<div class="pagination-container"><button class="page-btn" id="prevPageBtn" ${currentPage===1?'disabled':''}>◀ Назад</button><span class="page-info">${currentPage} / ${totalPages}</span><button class="page-btn" id="nextPageBtn" ${currentPage===totalPages?'disabled':''}>Вперед ▶</button></div>`;
            document.getElementById('prevPageBtn')?.addEventListener('click',()=>{ if(currentPage>1){ currentPage--; refreshTableBodyOnly(); } });
            document.getElementById('nextPageBtn')?.addEventListener('click',()=>{ if(currentPage<totalPages){ currentPage++; refreshTableBodyOnly(); } });
        } else if(pagDiv) pagDiv.innerHTML='';
    }

    function renderEventsPanel(){
        let html = `<div class="events-panel">`;

            html += `<div class="events-locked-icon">🔒</div><div class="events-locked-text">События сквада заблокированы администрацией</div>`;

        } else {
            html += `<h3 style="margin-bottom:1rem;">🗓️ События сквада</h3><div class="events-list">`;
            eventsData.forEach(e=>{ html+=`<div class="event-item" style="padding:0.9rem;border-left:4px solid #000;background:rgba(0,0,0,0.05);border-radius:20px;margin-bottom:0.7rem;"><strong>${escapeHtml(e.title)}</strong><br><span style="color:#e67e22;">📅 ${escapeHtml(e.date)}</span><p>${escapeHtml(e.desc)}</p></div>`; });
            if(isAdmin) html += `<button class="unlock-btn" id="lockEventsBtn" style="border-color:#000;">🔒 Заблокировать</button>`;
            html += `</div>`;
        }
        html += `<button class="back-button" id="backFromEventsBtn">← Назад</button></div>`;
        dynamicPanel.innerHTML = html;
        if(isAdmin) { if(eventsLocked) document.getElementById('unlockEventsBtn')?.addEventListener('click', unlockEvents); else document.getElementById('lockEventsBtn')?.addEventListener('click', lockEvents); }
        document.getElementById('backFromEventsBtn')?.addEventListener('click',()=>{ window.currentPanel=null; dynamicPanel.innerHTML=''; });
    }

    function renderSettingsPanel(){
        if(!isAdmin){ showAlert("Доступ только для администратора"); window.currentPanel=null; dynamicPanel.innerHTML=''; return; }
        let html = `<div class="settings-panel"><div class="settings-section"><h3>📋 Статусы граждан</h3><div class="flex-between"><span>Список доступных статусов</span><button class="settings-add-btn" id="addStatusBtn">+ Добавить статус</button></div>
        <table class="settings-table"><tbody id="statusesList"></tbody></table></div><div class="settings-section"><h3>💼 Работы / Должности</h3><div class="flex-between"><span>Список работ</span><button class="settings-add-btn" id="addWorkBtn">+ Добавить работу</button></div>
        <table class="settings-table"><tbody id="worksList"></tbody></table></div><div class="settings-section"><h3>⚔️ Воинская обязанность</h3><div class="flex-between"><span>Список статусов</span><button class="settings-add-btn" id="addDutyBtn">+ Добавить статус</button></div>
        <table class="settings-table"><tbody id="dutiesList"></tbody></table></div><button class="back-button" id="settingsBackBtn">← Назад</button></div>`;
        dynamicPanel.innerHTML = html;
        function renderLists() {
            document.getElementById('statusesList').innerHTML = statuses.map(s=>`<tr><td>${escapeHtml(s)}</td><td style="text-align:right;"><button class="settings-edit-btn" data-type="status" data-value="${escapeHtml(s)}">✏️</button><button class="settings-delete-btn" data-type="status" data-value="${escapeHtml(s)}">🗑️</button></td><tr>`).join('');
            document.getElementById('worksList').innerHTML = works.map(w=>`<tr><td>${escapeHtml(w)}</td><td style="text-align:right;"><button class="settings-edit-btn" data-type="work" data-value="${escapeHtml(w)}">✏️</button><button class="settings-delete-btn" data-type="work" data-value="${escapeHtml(w)}">🗑️</button></td></tr>`).join('');
            document.getElementById('dutiesList').innerHTML = duties.map(d=>`<tr><td>${escapeHtml(d)}</td><td style="text-align:right;"><button class="settings-edit-btn" data-type="duty" data-value="${escapeHtml(d)}">✏️</button><button class="settings-delete-btn" data-type="duty" data-value="${escapeHtml(d)}">🗑️</button></td>`).join('');
            document.querySelectorAll('.settings-edit-btn').forEach(btn=>{ btn.onclick=()=> openDictEditModal(btn.dataset.type, btn.dataset.value); });
            document.querySelectorAll('.settings-delete-btn').forEach(btn=>{ btn.onclick=()=> deleteDictItem(btn.dataset.type, btn.dataset.value); });
        }
        function openDictEditModal(type, oldValue){
            document.getElementById('dictType').value=type; document.getElementById('dictOldValue').value=oldValue;
            document.getElementById('dictNewValue').value=oldValue;
            document.getElementById('dictModalTitle').innerText = type==='status'?'✏️ Редактировать статус':(type==='work'?'✏️ Редактировать работу':'✏️ Редактировать обязанность');
            document.getElementById('editDictModal').style.display='flex';
        }
        function deleteDictItem(type, value){
            let msg = type==='status'?`Удалить статус "${value}"?`:(type==='work'?`Удалить работу "${value}"?`:`Удалить статус "${value}"?`);
            if((type==='status' && statuses.length<=1) || (type==='work' && works.length<=1) || (type==='duty' && duties.length<=1)){ showAlert("Нельзя удалить последний элемент!"); return; }
            showConfirm("Подтверждение", msg, (ok) => {
                if(ok){
                    if(type==='status'){ const newArr = statuses.filter(s=>s!==value); citizensData.forEach(c=>{ if(c.status===value) c.status=newArr[0]; }); statuses.length=0; statuses.push(...newArr); }
                    else if(type==='work'){ const newArr = works.filter(w=>w!==value); citizensData.forEach(c=>{ if(c.powerStatus===value) c.powerStatus=newArr[0]; }); works.length=0; works.push(...newArr); }
                    else if(type==='duty'){ const newArr = duties.filter(d=>d!==value); citizensData.forEach(c=>{ if(c.militaryDuty===value) c.militaryDuty=newArr[0]; }); duties.length=0; duties.push(...newArr); }
                    saveDictionaries(); updateSelects(); renderLists(); refreshTableBodyOnly(); showToast("Элемент удален");
                }
            });
        }
        document.getElementById('addStatusBtn').onclick=()=>{ let newVal = prompt("Введите новый статус:"); if(newVal && newVal.trim() && !statuses.includes(newVal.trim())){ statuses.push(newVal.trim()); saveDictionaries(); updateSelects(); renderLists(); refreshTableBodyOnly(); showToast(`Статус "${newVal}" добавлен`); } else if(statuses.includes(newVal)) showAlert("Такой статус уже существует!"); };
        document.getElementById('addWorkBtn').onclick=()=>{ let newVal = prompt("Введите новую работу:"); if(newVal && newVal.trim() && !works.includes(newVal.trim())){ works.push(newVal.trim()); saveDictionaries(); updateSelects(); renderLists(); refreshTableBodyOnly(); showToast(`Работа "${newVal}" добавлена`); } else if(works.includes(newVal)) showAlert("Такая работа уже существует!"); };
        document.getElementById('addDutyBtn').onclick=()=>{ let newVal = prompt("Введите новый статус:"); if(newVal && newVal.trim() && !duties.includes(newVal.trim())){ duties.push(newVal.trim()); saveDictionaries(); updateSelects(); renderLists(); refreshTableBodyOnly(); showToast(`Статус "${newVal}" добавлен`); } else if(duties.includes(newVal)) showAlert("Такой статус уже существует!"); };
        document.getElementById('dictSaveBtn').onclick=()=>{
            let type=document.getElementById('dictType').value, oldVal=document.getElementById('dictOldValue').value, newVal=document.getElementById('dictNewValue').value.trim();
            if(!newVal){ showAlert("Введите значение!"); return; }
            if(type==='status'){ if(statuses.includes(newVal) && newVal!==oldVal){ showAlert("Такой статус уже существует!"); return; } citizensData.forEach(c=>{ if(c.status===oldVal) c.status=newVal; }); statuses[statuses.indexOf(oldVal)]=newVal; }
            else if(type==='work'){ if(works.includes(newVal) && newVal!==oldVal){ showAlert("Такая работа уже существует!"); return; } citizensData.forEach(c=>{ if(c.powerStatus===oldVal) c.powerStatus=newVal; }); works[works.indexOf(oldVal)]=newVal; }
            else if(type==='duty'){ if(duties.includes(newVal) && newVal!==oldVal){ showAlert("Такой статус уже существует!"); return; } citizensData.forEach(c=>{ if(c.militaryDuty===oldVal) c.militaryDuty=newVal; }); duties[duties.indexOf(oldVal)]=newVal; }
            saveDictionaries(); updateSelects(); renderLists(); refreshTableBodyOnly(); showToast("Изменения сохранены");
            document.getElementById('editDictModal').style.display='none';
        };
        document.getElementById('dictCancelBtn').onclick=()=>{ document.getElementById('editDictModal').style.display='none'; };
        renderLists();
        document.getElementById('settingsBackBtn').onclick=()=>{ window.currentPanel=null; dynamicPanel.innerHTML=''; };
    }

    function renderCitizensTableFull(){
        currentPage=1;
        let addBtnHtml=isAdmin?`<button class="add-btn" id="addCitizenBtn">➕ Добавить гражданина</button>`:'';
        let html=`<div class="citizens-panel"><div class="panel-header"><div class="search-box"><input type="text" id="citizenSearch" placeholder="🔍 Поиск..." value="${escapeHtml(currentSearchQuery)}"></div><div class="sort-buttons"><button class="sort-btn ${currentSort==='name_asc'?'active':''}" data-sort="name_asc">📋 По имени</button><button class="sort-btn ${currentSort==='activity_desc'?'active':''}" data-sort="activity_desc">⚡ Активность</button><button class="sort-btn ${currentSort==='joinDate_asc'?'active':''}" data-sort="joinDate_asc">📅 Дата вступления</button><button class="sort-btn ${currentSort==='powerStatus_asc'?'active':''}" data-sort="powerStatus_asc">💼 Работа</button><button class="sort-btn ${currentSort==='duty_asc'?'active':''}" data-sort="duty_asc">⚔️ Воинская обязанность</button></div>${addBtnHtml}</div>
        <div style="overflow-x:auto;"><table id="citizensDynamicTable"><thead><tr><th>Гражданин</th><th>Дата вступления</th><th>Активность</th><th>Работа</th><th>Статус</th><th>Воинская обязанность</th>${isAdmin?'<th>Действия</th>':''} </thead><tbody></tbody>}</div><div id="paginationControls"></div><button class="back-button" id="backToMainBtn">← Назад</button></div>`;
        dynamicPanel.innerHTML=html;
        updateSelects();
        refreshTableBodyOnly();
        if(isAdmin) document.getElementById('addCitizenBtn')?.addEventListener('click',openAddModal);
        document.getElementById('citizenSearch')?.addEventListener('input',(e)=>{ currentSearchQuery=e.target.value; currentPage=1; refreshTableBodyOnly(); });
        document.querySelectorAll('.sort-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ let val=btn.getAttribute('data-sort'); if(val){ currentSort=val; currentPage=1; document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); refreshTableBodyOnly(); } }); });
        document.getElementById('backToMainBtn')?.addEventListener('click',()=>{ window.currentPanel=null; dynamicPanel.innerHTML=''; });
    }
    
    document.getElementById('showCitizensBtn').onclick=()=>{ window.currentPanel='citizens'; currentSearchQuery=""; currentSort="name_asc"; renderCitizensTableFull(); };
    document.getElementById('showEventsBtn').onclick=()=>{ window.currentPanel='events'; renderEventsPanel(); };
    
    function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    window.addEventListener('load',()=>{
        mainContent.classList.remove('visible');
        setTimeout(()=>{
            heroScreen.classList.add('hide-hero');
            setTimeout(()=>{ heroScreen.style.display='none'; mainContent.classList.add('visible'); },700);
        },1500);
    });
</script>
</body>
</html>
